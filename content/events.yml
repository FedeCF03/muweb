# ===========================================================================
#  Agenda de eventos.
#
#  day:   Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo
#         o "Todos los días" (se repite los 7 días)
#  time:  hora de inicio (formato 24 h, hora local del server)
#  duration: cuánto dura ("1 h", "Todo el día", etc.)
#
#  El próximo evento se calcula solo: la web muestra el más cercano con
#  cuenta regresiva y marca el día de hoy en la agenda.
#  Blood Castle (cada 2 h en punto) y Devil Square (a y media) no se listan
#  acá para no llenar la agenda: están en la página de Jugabilidad.
# ===========================================================================

