# ===========================================================================
#  Agenda de eventos (configuración real de OpenMU, ver /opt/lab/CONFIG.md).
#
#  day:   Lunes ... Domingo, o "Todos los días" (se repite los 7 días)
#  time:  hora de inicio, en hora Argentina (UTC-3). OpenMU guarda los
#         horarios en UTC: sumá 3 horas para compararlos con el panel.
#  duration: cuánto dura o cuánto tiempo está abierta la entrada
#
#  El próximo evento se calcula solo: la web muestra el más cercano con
#  cuenta regresiva y marca el día de hoy en la agenda.
# ===========================================================================

