# ===========================================================================
#  Jugabilidad del server. Se muestra en /jugabilidad.
#
#  Fuente: configuración real de OpenMU en el VPS (/opt/lab/CONFIG.md,
#  aplicada el 2026-10-21). Todo lo que dice este archivo es una promesa a los
#  jugadores: si cambiás algo en el panel de OpenMU, cambialo también acá.
#  Una sección que no esté en el archivo no se muestra en la página.
# ===========================================================================

intro: >-
  Season 6 Episode 3 sobre OpenMU, con experiencia 10x, Happy Hour cuatro
  veces por día y resets sin límite.

config:
  - label: "Versión"
    value: "Season 6 Episode 3 (OpenMU)"
  - label: "Experiencia"
    value: "10x"
  - label: "Experiencia master"
    value: "10x"
  - label: "Happy Hour"
    value: "15x durante 1 hora, 4 veces por día"
  - label: "Drop"
    value: "Por defecto de OpenMU (sin modificar)"
  - label: "Nivel máximo"
    value: "400"
  - label: "Resets"
    value: "Sin límite"
  - label: "Game servers activos"
    value: "1"

experience:
  summary: >-
    La experiencia normal es 10x, igual para la experiencia master. Durante la
    Happy Hour se multiplica por 1,5: pasa a 15x durante una hora.
  points:
    - "Experiencia normal: 10x. Experiencia master: 10x."
    - "Happy Hour: 15x durante 1 hora."
    - "El reset no te baja el master level: el nivel master y sus puntos se conservan."
  # Horarios de Happy Hour (hora Argentina)
  happy_hour: ["03:05", "09:05", "15:05", "21:05"]

reset:
  points:
    - label: "Nivel requerido"
      value: "400"
    - label: "Nivel después del reset"
      value: "10"
    - label: "Costo"
      value: "10.000.000 Zen × número de reset"
    - label: "Puntos"
      value: "1.000 × número de reset"
    - label: "Stats"
      value: "Se reinician"
    - label: "Master level"
      value: "Se conserva"
    - label: "Límite de resets"
      value: "Sin límite"
  how: >-
    Llegá a nivel 400 y escribí /reset, o hablá con Leo the Helper en Lorencia.
    Volvés a Lorencia en nivel 10 y pasás a la selección de personajes.
  # Ejemplos calculados con las fórmulas de arriba
  examples:
    - { reset: 1, cost: "10.000.000", points: "1.000" }
    - { reset: 2, cost: "20.000.000", points: "2.000" }
    - { reset: 3, cost: "30.000.000", points: "3.000" }
    - { reset: 5, cost: "50.000.000", points: "5.000" }
    - { reset: 10, cost: "100.000.000", points: "10.000" }
  note: >-
    Los puntos no se suman a los anteriores: en cada reset quedás con el total
    que corresponde a ese número de reset.

# Puntos de stat por nivel según la clase (valores de Season 6, key = classes.yml)
class_points:
  dk: 5
  dw: 5
  elf: 5
  sum: 5
  mg: 7
  dl: 7
  rf: 7

events:
  note: >-
    Hora Argentina (UTC-3). La entrada a Blood Castle y Devil Square está
    abierta 1 minuto; la de Chaos Castle, 5 minutos.
  items:
    - { name: "Blood Castle", times: ["18:00", "20:00", "22:00"] }
    - { name: "Devil Square", times: ["18:30", "20:30", "22:30"] }
    - { name: "Chaos Castle", times: ["19:00", "21:00", "23:00"] }
    - { name: "Kanturu", times: ["03:00", "09:00", "15:00", "21:00"] }

commands:
  - { cmd: "/reset", what: "Resetear el personaje (nivel 400 y Zen)" }
  - { cmd: "/resetinfo", what: "Ver el costo y los puntos del próximo reset" }
