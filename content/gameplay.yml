# ===========================================================================
#  Jugabilidad del server: configuración, experiencia, resets, clases, PvP,
#  guild, drops, mapas, Chaos Mix y comandos. Se muestra en /jugabilidad.
#  Editá los valores acá y recargá la página.
#
#  OJO: todo lo que dice este archivo es una promesa a los jugadores. Cada
#  valor tiene que coincidir con la configuración real de OpenMU.
# ===========================================================================

intro: >-
  Server Slow de Season 6 Episode 3 con PvP competitivo. Subir cuesta, y
  cuesta más en cada reset: la gracia es que cada nivel se gane.

# Ficha general (tabla de dos columnas)
config:
  - label: "Versión"
    value: "Season 6 Episode 3"
  - label: "Estilo"
    value: "Slow · Full PvP competitivo"
  - label: "Experiencia"
    value: "x5 progresiva"
  - label: "Drop de ítems"
    value: "x20 (difícil)"
  - label: "Drop de Zen"
    value: "Difícil"
  - label: "Nivel máximo"
    value: "400"
  - label: "Resets máximos"
    value: "5"
  - label: "Conexiones"
    value: "Hasta 5 por PC / IP"
  - label: "Máx. opción con Jewel of Life"
    value: "+16"
  - label: "Máx. upgrade de ítem"
    value: "+15"
  - label: "Diferencia de nivel en party"
    value: "130 niveles"
  - label: "Delay de pociones"
    value: "300 ms"
  - label: "Self Defense"
    value: "30 segundos"
  - label: "Auto-ataque (F8)"
    value: "Deshabilitado"
  - label: "MU Helper"
    value: "Activado"
  - label: "OFF Helper"
    value: "Activado (activá el helper y usá /offline)"
  - label: "Blood Castle"
    value: "Hasta 3 por día"
  - label: "Devil Square"
    value: "Hasta 3 por día"

# Ganancia de experiencia
experience:
  summary: >-
    La base es un x5 Slow tradicional, pero la dificultad se concentra arriba:
    la curva corre del nivel 100 al 400 y se endurece con cada reset.
  points:
    - "Del nivel 1 al 100 se sube rápido; la curva arranca en el 100."
    - "Cada 2 resets la experiencia baja a la mitad."
    - "Volver al 400 cuesta un poco más en cada reset."
    - "El tiempo por reset depende de tu ritmo, la party, los spots y los eventos."
  # Rate del tramo según el reset (porcentaje del rate base)
  curve:
    - stage: "Lv. 100–200"
      reset_1: "90%"
      reset_5: "—"
    - stage: "Lv. 100–367"
      reset_1: "Baja de a poco"
      reset_5: "—"
    - stage: "Lv. 368–386"
      reset_1: "Zona avanzada (cae fuerte desde el 371)"
      reset_5: "—"
    - stage: "Lv. 397–400"
      reset_1: "4%"
      reset_5: "1%"

# Sistema de reset
reset:
  points:
    - label: "Nivel requerido"
      value: "400"
    - label: "Costo"
      value: "25.000.000 Zen (sube en cada reset)"
    - label: "Stats"
      value: "Se reinician"
    - label: "Skills"
      value: "Se conservan"
    - label: "Puntos por reset"
      value: "500"
    - label: "Resets máximos"
      value: "5"
    - label: "Experiencia"
      value: "Baja a la mitad cada 2 resets"
  how: "Llegá a nivel 400, juntá el Zen y escribí /reset en el chat."

# Puntos de stat por nivel según la clase (key = classes.yml)
class_points:
  dk: 5
  dw: 5
  elf: 5
  sum: 5
  mg: 7
  dl: 7
  rf: 7

party:
  - "Party de 5: bonus de experiencia completo."
  - "Party de 4, 3 o 2: la experiencia baja según la cantidad de integrantes."
  - "Solo: progresás casi igual que en una party de 5."
  - "Diferencia máxima de nivel dentro de la party: 130."

pvp:
  summary: >-
    El server prioriza el PvP competitivo y balanceado: por clase, por etapa de
    progreso y por lo que se puede conseguir en cada momento. Ganan la
    estrategia, la party y la mano del jugador.
  pk:
    - label: "Limpiar PK (/pk)"
      value: "5.000.000 Zen"
    - label: "Por cada kill extra"
      value: "+5.000.000 Zen"
    - label: "PK en eventos"
      value: "Activado"
  dark_lord_summon:
    - label: "Nivel para Summon (Dark Lord)"
      value: "200"
    - label: "Summon con PK"
      value: "Activado"

guild:
  - label: "Crear guild"
    value: "Nivel 150"
  - label: "Miembros"
    value: "Hasta 40"
  - label: "Alianzas"
    value: "No hay"
  - label: "Castle Siege"
    value: "Mínimo 30 miembros"

drops:
  limits:
    - label: "Sets, armas y escudos"
      value: "Hasta Semi Full, se habilita por etapas"
    - label: "Anillos y pendientes"
      value: "Hasta 3 opciones"
    - label: "Alas"
      value: "Pueden salir Full"
  special:
    - item: "Loch's Feather"
      where: "Icarus"
    - item: "Crest of Monarch"
      where: "Icarus"
    - item: "Dark Horse / Spirit"
      where: "Kanturu e Icarus"
    - item: "Gemstone"
      where: "Kanturu Relics"
    - item: "Sign of Lord"
      where: "La Cleon, Swamp y Kanturu"
  note: >-
    Las plumas y el Crest solo caen en Icarus, que pide 1 reset o más. El drop
    es muy difícil en todos los servidores.

