# ===========================================================================
#  Contenido principal del sitio.
#  Editá este archivo y recargá la página: no hay que tocar código.
#  Todo lo marcado con "EDITAR" es un valor de ejemplo.
# ===========================================================================

# EDITAR: nombre del server
name: "OpenMuArg"

# EDITAR: bajada corta, se usa en el subtítulo del navegador
tagline: "Server privado de MU Online — Season 6 Episode 3"

seo:
  title: "OpenMuArg | Server privado de MU Online — Season 6 Episode 3"
  description: >-
    Server privado de MU Online Season 6 Episode 3 sobre OpenMU. Experiencia 10x,
    Happy Hour 15x, resets sin límite y cliente listo para descargar.
  keywords: "mu online, mu online privado, season 6, episode 3, mu online server, descend"

server:
  season: "Season 6"
  episode: "Episode 3"
  # Versión del cliente (WebZen 1.02.00)
  client_version: "1.02.00"
  # La dirección del Connect Server NO se publica en la web: el cliente ya
  # trae el ServerInfo configurado. Host y puerto viven en .env (CONNECT_HOST,
  # CONNECT_PORT) y solo se usan para el estado en vivo (FEATURE_STATUS).
  # EDITAR: invite de Discord
  discord_url: "https://discord.gg/tu-servidor"
  # Texto de estado. Solo se muestra si FEATURE_STATUS=1 (medido en vivo).
  status_label: "Online"

hero:
  badge: "Season 6 — Episode 3"
  title: "OpenMuArg"
  subtitle: >-
    Season 6 Episode 3 sobre OpenMU. Experiencia 10x, Happy Hour 15x cuatro
    veces por día y resets sin límite, para volver al MU de siempre.
  primary:
    label: "Descargar cliente"
    href: "/descargas"
  secondary:
    label: "Crear cuenta"
    href: "/registro"

# Rates: se muestran en la bienvenida de la home. El detalle completo está en
# content/gameplay.yml (página /jugabilidad).
rates:
  - label: "Experiencia"
    value: "10x"
  - label: "Happy Hour"
    value: "15x"
  - label: "Nivel para reset"
    value: "400"
  - label: "Resets"
    value: "Sin límite"

features:
  - icon: "sword"
    title: "Las 7 clases de Season 6"
    text: "Dark Knight, Dark Wizard, Fairy Elf, Summoner, Magic Gladiator, Dark Lord y Rage Fighter."
  - icon: "shield"
    title: "Sin ventaja comprada"
    text: "Todo el contenido es jugable. Las recompensas de la tienda son estéticas y opcionales."
  - icon: "scroll"
    title: "Resets sin límite"
    text: "Reset en nivel 400: 1.000 puntos y 10.000.000 de Zen por cada número de reset. El master level se conserva."
  - icon: "crown"
    title: "Eventos todos los días"
    text: "Blood Castle, Devil Square y Chaos Castle cada noche, Kanturu cuatro veces por día y Happy Hour 15x."

steps:
  - title: "Descargá el cliente"
    text: "Bajá el pack completo (1.02.00), descomprimilo en una carpeta y no muevas los archivos."
  - title: "Creá tu cuenta"
    text: "Registrate en el formulario del sitio. Tu cuenta queda lista para entrar al juego."
  - title: "Entrá al mundo"
    text: "Abrí el launcher, elegí el sub-servidor y a jugar. Nadie te va a pedir donate para jugar."

community:
  title: "Entrá a la comunidad"
  text: >-
    Discord con los anuncios, eventos y soporte. También se coordinan las partidas
    en grupo y se comparten capturas de los mejores personajes.
  cta_label: "Unirme al Discord"

footer:
  note: "OpenMuArg no está afiliado a Webzen. Proyecto fan sin fines de lucro."
  links:
    - label: "Noticias"
      href: "/noticias"
    - label: "Descargas"
      href: "/descargas"
    - label: "Preguntas frecuentes"
      href: "/faq"
    - label: "Reglas"
      href: "/reglas"
