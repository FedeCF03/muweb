{# Tarjeta de la galería. Uso: {{ gallery_tile(item) }}
   Si el item tiene image, muestra la foto; si no, un arte generado
   con la paleta del mapa (lista para reemplazar por la captura real). #}
{% from "partials/icon.html" import icon %}

{% macro gallery_tile(item) -%}
  <button
    type="button"
    class="panel panel-hover group relative aspect-video w-full cursor-pointer overflow-hidden p-0 text-left"
    data-lightbox
    data-map="{{ item.map }}"
    aria-label="Ampliar {{ item.map }}"
  >
    {% if item.image %}
      <img
        src="{{ url_for('static', filename='img/' ~ item.image) }}"
        alt="{{ item.map }}"
        loading="lazy"
        class="absolute inset-0 h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.04]"
      />
    {% else %}
      <span class="art art-{{ item.palette }}" data-glyph="{{ item.map[0] }}" aria-hidden="true"></span>
    {% endif %}

    <span class="absolute inset-0 flex flex-col justify-end bg-gradient-to-t from-obsidian/95 via-obsidian/35 to-transparent p-5">
      <span class="text-[0.65rem] font-bold uppercase tracking-[0.2em] text-gold">{{ item.tag }}</span>
      <span class="mt-1 font-display text-xl text-mist">{{ item.map }}</span>
      <span class="mt-1 text-xs text-muted">{{ item.level }}{% if not item.image %} · captura próximamente{% endif %}</span>
    </span>

    <span class="absolute right-4 top-4 rounded-md border border-edge bg-obsidian/70 p-2 text-muted opacity-0 backdrop-blur transition-opacity duration-300 group-hover:opacity-100">
      {{ icon('spark', 'h-4 w-4') }}
    </span>
  </button>
{%- endmacro %}
