{# Tarjeta de mapa. Uso: {{ gallery_tile(item) }}
   Si el item tiene image, muestra la foto; si no, un arte generado
   con la paleta del mapa (lista para reemplazar por la captura real). #}
{% macro gallery_tile(item) -%}
  <button
    type="button"
    class="group relative aspect-[16/9] w-full cursor-pointer overflow-hidden rounded border border-gold-deep bg-face p-0 text-left"
    data-lightbox
    data-map="{{ item.map }}"
    aria-label="Ampliar {{ item.map }}"
  >
    {% if item.image %}
      <img
        src="{{ url_for('static', filename='img/' ~ item.image) }}"
        alt="{{ item.map }}"
        loading="lazy"
        class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 group-hover:scale-[1.03]"
      />
    {% else %}
      <span class="art" data-glyph="{{ item.map[0] }}" aria-hidden="true"></span>
    {% endif %}

    <span class="absolute inset-x-0 bottom-0 flex items-end justify-between gap-4 bg-gradient-to-t from-panel-deep via-panel-deep/80 to-transparent px-5 pt-12 pb-4">
      <span class="flex flex-col">
        <span class="text-lg font-bold uppercase tracking-[0.1em] text-lum">{{ item.map }}</span>
        <span class="mt-1 text-xs text-muted">{{ item.tag }}{% if not item.image %} · captura próximamente{% endif %}</span>
      </span>
      <span class="readout shrink-0 px-2.5 py-1 text-xs">{{ item.level }}</span>
    </span>
  </button>
{%- endmacro %}
